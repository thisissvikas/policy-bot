name: PolicyBot Review
description: >
  AI-powered PR review against your coding standards and ADRs.
  Must be triggered by a pull_request event — using any other trigger
  (push, workflow_dispatch, schedule) will fail at argument parsing
  because github.event.pull_request.number is empty on non-PR events.
author: thisissvikas

inputs:
  config-path:
    description: Path to policybot.yaml
    required: false
    default: policybot.yaml
  anthropic-api-key:
    description: Anthropic API key for Claude
    required: true
  github-token:
    description: >
      GitHub token for reading PR diffs and posting inline review comments.
      The token must have the `pull-requests: write` permission — the default
      `github.token` works if the calling workflow declares:
        permissions:
          pull-requests: write
      Without this permission, posting review comments will fail with a 403.
    required: false
    default: ${{ github.token }}
  model:
    description: Claude model to use
    required: false
    default: claude-sonnet-4-5

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: "3.12"

    - name: Install PolicyBot
      shell: bash
      run: |
        cd ${{ github.action_path }}
        uv sync --frozen --no-dev

    - name: Run PolicyBot
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # Use the caller's policybot.yaml if it exists; fall back to the action's own defaults
        CONFIG="${{ inputs.config-path }}"
        if [ ! -f "$CONFIG" ]; then
          echo "No $CONFIG found in this repo — using action defaults"
          CONFIG="${{ github.action_path }}/policybot.yaml"
        fi
        uv run --project ${{ github.action_path }} policybot review \
          --config "$CONFIG" \
          --pr "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --model "${{ inputs.model }}"

branding:
  icon: shield
  color: blue
